<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 12 104 96" role="img" aria-labelledby="t">
  <title id="t">Robbe Fransen monogram</title>
  <defs>
    <!-- centerline of R and F -->
    <path id="p" d="M18 100 V20 H46 a20 20 0 0 1 0 40 H18 M44 60 L64 100 M80 100 V20 H106 M80 58 H100"/>
    <!-- mask cuts a see-through channel through the thick stroke = two outer lines -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="130" height="130">
      <rect x="0" y="0" width="130" height="130" fill="#fff"/>
      <use href="#p" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g fill="none" stroke="#1E1E1E" stroke-linecap="round" stroke-linejoin="round">
    <use href="#p" stroke-width="15" mask="url(#cut)"/>
    <use href="#p" stroke-width="2.5"/>
  </g>
</svg>
