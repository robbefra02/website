{%- comment -%}
  Reusable SVG drawings, defined once per page and used with <svg><use href="#rf"/></svg>.
  Hidden itself (width/height 0). See brand/logo-rules.md for the monogram rules.
{%- endcomment -%}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- centerline of the R and the F -->
    <path id="rf-path" d="M18 100 V20 H46 a20 20 0 0 1 0 40 H18 M44 60 L64 100 M80 100 V20 H106 M80 58 H100"/>
    <!-- cuts a see-through channel through the thick line, which turns it into two outer lines -->
    <mask id="rf-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="130" height="130">
      <rect width="130" height="130" fill="white"/>
      <use href="#rf-path" fill="none" stroke="black" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <!-- triple-line monogram: color follows the CSS "color" of the <svg> that uses it -->
  <symbol id="rf" viewBox="10 12 104 96">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <use href="#rf-path" stroke-width="15" mask="url(#rf-cut)"/>
      <use href="#rf-path" stroke-width="2.5"/>
    </g>
  </symbol>

  <!-- Small 24x24 icons for the header buttons. They follow the text color. -->
  <symbol id="icon-sun" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </g>
  </symbol>
  <symbol id="icon-moon" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
  </symbol>
  <symbol id="icon-pause" viewBox="0 0 24 24">
    <path fill="currentColor" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>
  </symbol>
  <symbol id="icon-play" viewBox="0 0 24 24">
    <path fill="currentColor" d="M8 5l11 7-11 7z"/>
  </symbol>
</svg>
